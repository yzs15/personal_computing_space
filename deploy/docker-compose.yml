secrets:
  internal_api_secret:
    file: ${LOOM_INTERNAL_API_SECRET_FILE:-../secrets/internal_api_secret}

services:
  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: loom
      MINIO_ROOT_PASSWORD: loom-content-secret
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set loom http://minio:9000 loom loom-content-secret && mc mb --ignore-existing loom/loom-content"]

  observer-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom_observer
    volumes: [observer-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom_observer"]
      interval: 2s
      timeout: 3s
      retries: 20

  slave-a-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom_slave_a
    volumes: [slave-a-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom_slave_a"]
      interval: 2s
      timeout: 3s
      retries: 20

  slave-b-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loom
      POSTGRES_PASSWORD: loom
      POSTGRES_DB: loom_slave_b
    volumes: [slave-b-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loom -d loom_slave_b"]
      interval: 2s
      timeout: 3s
      retries: 20

  observer:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "export LOOM_INTERNAL_API_SECRET=\"$$(cat /run/secrets/internal_api_secret)\" && exec uvicorn loom_v2.observer.app:app --host 0.0.0.0 --port 8080"]
    environment:
      LOOM_SERVICE_NAME: observer
      LOOM_DATABASE_URL: postgresql+asyncpg://loom:loom@observer-db:5432/loom_observer
      LOOM_S3_ENDPOINT_URL: http://minio:9000
      LOOM_S3_BUCKET: loom-content
      LOOM_S3_ACCESS_KEY: loom
      LOOM_S3_SECRET_KEY: loom-content-secret
      LOOM_S3_REGION: us-east-1
    secrets: [internal_api_secret]
    depends_on:
      observer-db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["18080:8080"]

  driver:
    build:
      context: ..
      dockerfile: Dockerfile.driver
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.151.0}
    environment:
      LOOM_SERVICE_NAME: driver
      LOOM_OBSERVER_URL: http://observer:8080
      LOOM_WORKSPACE_ID: workspace-default
      LOOM_WORKSPACE_ROOT: /workspace
      LOOM_AGENT_ID: driver-default
      LOOM_CODING_AGENT_BACKEND: codex
      LOOM_CODEX_MODEL: deepseek-v4-flash
      LOOM_CODEX_PROVIDER: proxy
      LOOM_CODEX_BASE_URL: ${LOOM_CODEX_BASE_URL:-http://host.docker.internal:8787}
      LOOM_CODEX_MODEL_REASONING_EFFORT: xhigh
      LOOM_CODEX_APPROVALS_REVIEWER: guardian_subagent
      LOOM_CODEX_SANDBOX_MODE: danger-full-access
      LOOM_CODEX_MODEL_CATALOG_JSON: /var/lib/loom/codex/model_catalog.json
      LOOM_CODEX_API_KEY_ENV: OPENAI_API_KEY
      LOOM_CODEX_WIRE_API: responses
      LOOM_SLAVE_A_URL: http://slave-a:8081
      LOOM_SLAVE_B_URL: http://slave-b:8082
      LOOM_S3_ENDPOINT_URL: http://minio:9000
      LOOM_S3_BUCKET: loom-content
      LOOM_S3_ACCESS_KEY: loom
      LOOM_S3_SECRET_KEY: loom-content-secret
      LOOM_S3_REGION: us-east-1
    secrets: [internal_api_secret]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${LOOM_WORKSPACE_PATH:-..}:/workspace
      - driver-codex-state:/var/lib/loom/codex
      - ${LOOM_CODEX_MODEL_CATALOG_PATH:-../../.codex/model_catalog.json}:/var/lib/loom/codex/model_catalog.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      minio-init: {condition: service_completed_successfully}

  slave-a:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "export LOOM_INTERNAL_API_SECRET=\"$$(cat /run/secrets/internal_api_secret)\" && exec uvicorn loom_v2.slave.app:create_app --factory --host 0.0.0.0 --port 8081"]
    environment:
      LOOM_SERVICE_NAME: slave-a
      LOOM_DATABASE_URL: postgresql+asyncpg://loom:loom@slave-a-db:5432/loom_slave_a
      LOOM_OBSERVER_URL: http://observer:8080
      LOOM_S3_ENDPOINT_URL: http://minio:9000
      LOOM_S3_BUCKET: loom-content
      LOOM_S3_ACCESS_KEY: loom
      LOOM_S3_SECRET_KEY: loom-content-secret
      LOOM_S3_REGION: us-east-1
    secrets: [internal_api_secret]
    depends_on:
      slave-a-db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  slave-b:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["/bin/sh", "-c", "export LOOM_INTERNAL_API_SECRET=\"$$(cat /run/secrets/internal_api_secret)\" && exec uvicorn loom_v2.slave.app:create_app --factory --host 0.0.0.0 --port 8082"]
    environment:
      LOOM_SERVICE_NAME: slave-b
      LOOM_DATABASE_URL: postgresql+asyncpg://loom:loom@slave-b-db:5432/loom_slave_b
      LOOM_OBSERVER_URL: http://observer:8080
      LOOM_S3_ENDPOINT_URL: http://minio:9000
      LOOM_S3_BUCKET: loom-content
      LOOM_S3_ACCESS_KEY: loom
      LOOM_S3_SECRET_KEY: loom-content-secret
      LOOM_S3_REGION: us-east-1
    secrets: [internal_api_secret]
    depends_on:
      slave-b-db: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

volumes:
  observer-db-data:
  slave-a-db-data:
  slave-b-db-data:
  minio-data:
  driver-codex-state:
